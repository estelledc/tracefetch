[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tracefetch"
version = "0.1.0"
description = "Safe search routing and provenance-bearing evidence bundles for AI research workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "estelledc" }]
keywords = ["search", "web", "provenance", "evidence", "crawler", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]
markitdown = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.3,<1"]

[project.scripts]
tracefetch = "tracefetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefetch"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tracefetch"]

[tool.coverage.run]
branch = true
source = ["tracefetch"]

[tool.coverage.report]
fail_under = 80
show_missing = true
